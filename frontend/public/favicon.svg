<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Recorte redondeado del ícono -->
    <clipPath id="card-clip">
      <rect x="24" y="24" width="464" height="464" rx="96" ry="96" />
    </clipPath>

    <!-- Recorte mitad izquierda (Fútbol) -->
    <clipPath id="left-side">
      <polygon points="0,0 352,0 160,512 0,512" />
    </clipPath>

    <!-- Recorte mitad derecha (Pádel) -->
    <clipPath id="right-side">
      <polygon points="352,0 512,0 512,512 160,512" />
    </clipPath>

    <!-- Sombra suave para las iniciales -->
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fondo base y borde oscuro -->
  <rect x="8" y="8" width="496" height="496" rx="110" ry="110" fill="#0A1410" />

  <!-- Contenido principal recortado -->
  <g clip-path="url(#card-clip)">
    
    <!-- LADO FÚTBOL (Verde) -->
    <g clip-path="url(#left-side)">
      <rect width="512" height="512" fill="#16A34A" />
      <!-- Líneas de cancha de fútbol -->
      <g stroke="#ffffff" stroke-width="12" stroke-opacity="0.35" fill="none">
        <!-- Área superior -->
        <rect x="110" y="10" width="210" height="110" transform="rotate(20 200 60)" />
        <path d="M 155 120 A 55 55 0 0 0 255 120" transform="rotate(20 200 60)" />
        <!-- Círculo central -->
        <circle cx="95" cy="240" r="65" />
        <line x1="20" y1="205" x2="175" y2="275" />
        <!-- Área inferior -->
        <rect x="-20" y="390" width="160" height="120" transform="rotate(20 60 450)" />
      </g>
    </g>

    <!-- LADO PÁDEL (Azul) -->
    <g clip-path="url(#right-side)">
      <rect width="512" height="512" fill="#1D4ED8" />
      <!-- Líneas de cancha de pádel -->
      <g stroke="#ffffff" stroke-width="12" stroke-opacity="0.35" fill="none">
        <!-- Líneas de saque y red en perspectiva -->
        <line x1="360" y1="100" x2="520" y2="170" />
        <line x1="220" y1="370" x2="460" y2="480" />
        <line x1="485" y1="155" x2="345" y2="430" />
        <line x1="270" y1="240" x2="520" y2="350" stroke-width="16" stroke-opacity="0.45" />
      </g>
    </g>

    <!-- Línea divisoria diagonal sutil -->
    <line x1="352" y1="0" x2="160" y2="512" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />
  </g>

  <!-- Iniciales RC -->
  <text x="256" y="340" font-family="Inter, system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="250" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6" filter="url(#text-shadow)">RC</text>
</svg>