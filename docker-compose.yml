# Simulación LOCAL de los 3 droplets en una sola máquina (para probar y para la demo).
# El despliegue real en DigitalOcean está en deploy/ (un compose por droplet).
#
#   navegador ──► nginx:8080 (acceso) ──┬──► api1 (droplet-1) ─┐
#                                       ├──► api2 (droplet-2) ─┼──► db (PostgreSQL, Docker)
#                                       └──► api3 (droplet-3) ─┘
#
# Todos los datos (empresas, canchas, turnos, torneos, clientes) están en PostgreSQL.
#
# Solo Nginx publica un puerto hacia afuera; la API queda en la red interna
# "red_canchas". PostgreSQL además escucha en 127.0.0.1:5435 (solo esta PC) para
# poder correr la API con "npm run dev" desde backend/ usando backend/.env.

# Configuración común a todas las réplicas de la API
x-api: &api
  build: ./backend
  restart: unless-stopped
  environment: &api-env
    PORT: 3000
    DB_HOST: db                 # nombre del servicio de PostgreSQL
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    DB_NAME: canchas
    DB_SSL: "false"
    JWT_SECRET: ${JWT_SECRET:-clave_solo_para_pruebas_locales}
  depends_on:
    db:
      condition: service_healthy
  networks:
    - red_canchas

services:
  # Base SQL única, compartida por todas las réplicas
  db:
    build: ./database            # PostgreSQL con el esquema y los datos de demo
    container_name: canchas-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Solo accesible desde esta PC. Se usa el 5435 porque el 5432 suele estar ocupado
      # por un PostgreSQL instalado; para cambiarlo: DB_PUERTO_LOCAL=<puerto>
      - "127.0.0.1:${DB_PUERTO_LOCAL:-5435}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data              # persistencia
    networks:
      - red_canchas

  # Réplicas de la API (misma imagen, distinto contenedor). DROPLET es el
  # nombre que se ve en el pie de página del front.
  api1:
    <<: *api
    container_name: canchas-api1
    environment:
      <<: *api-env
      DROPLET: droplet-1
  api2:
    <<: *api
    container_name: canchas-api2
    environment:
      <<: *api-env
      DROPLET: droplet-2
  api3:
    <<: *api
    container_name: canchas-api3
    environment:
      <<: *api-env
      DROPLET: droplet-3

  # Máquina de acceso: balanceador de carga + front
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: canchas-nginx
    restart: unless-stopped
    environment:
      NODO1: api1:3000
      NODO2: api2:3000
      NODO3: api3:3000
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - red_canchas

networks:
  red_canchas:
    driver: bridge

volumes:
  datos_postgres:
