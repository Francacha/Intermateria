# Nginx: único punto de acceso al sistema (droplet 1).
#  - Sirve el front compilado (React).
#  - Balancea las peticiones /api/ entre las APIs de los 3 droplets.
#
# ${NODO1}, ${NODO2} y ${NODO3} se reemplazan al arrancar el contenedor con las
# variables de entorno del docker-compose (la imagen oficial de Nginx procesa
# /etc/nginx/templates con envsubst). Así el mismo archivo sirve en local
# (api1:3000) y en los droplets (IP privada:3000).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # En el log se ve a qué nodo fue cada petición (upstream=...)
    log_format balanceo '$remote_addr "$request" $status '
                        'upstream=$upstream_addr tiempo=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo;

    # Grupo de servidores de la API: un nodo por droplet.
    # Sin directiva extra el algoritmo es round-robin (uno cada uno).
    # Si un nodo falla 3 veces, se lo saca de la rotación por 10 segundos.
    upstream api_canchas {
        # Memoria compartida entre los procesos de Nginx: sin esto cada proceso
        # lleva su propio turno y casi todas las peticiones caen en el nodo 1.
        zone api_canchas 64k;

        server ${NODO1} max_fails=3 fail_timeout=10s;
        server ${NODO2} max_fails=3 fail_timeout=10s;
        server ${NODO3} max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Peticiones a la API → se reparten entre los droplets
        location /api/ {
            proxy_pass http://api_canchas;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si un nodo está caído o falla, se reintenta en el siguiente
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 3s;
        }

        # Front (SPA): cualquier ruta desconocida vuelve a index.html
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
