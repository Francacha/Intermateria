# Nginx: único punto de acceso al sistema (droplet 1).
#  - Sirve el front compilado (React).
#  - Balancea las peticiones /api/ entre las APIs de los droplets.
#
# SERVIDORES_API (la lista de "server" del upstream) se arma al arrancar el contenedor a partir de la variable
# NODOS del docker-compose (ver nodos.envsh): una línea "server" por nodo.
# Después la imagen oficial de Nginx procesa /etc/nginx/templates con envsubst.
# Así el mismo archivo sirve en local (api1:3000 ...) y en los droplets
# (IP privada:3000), con 2, 3 o más nodos.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # En el log se ve a qué nodo fue cada petición (upstream=...)
    log_format balanceo '$remote_addr "$request" $status '
                        'upstream=$upstream_addr tiempo=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo;

    # Grupo de servidores de la API: un nodo por droplet.
    # Sin directiva extra el algoritmo es round-robin (uno cada uno).
    # Si un nodo falla 3 veces, se lo saca de la rotación por 10 segundos.
    upstream api_canchas {
        # Memoria compartida entre los procesos de Nginx: sin esto cada proceso
        # lleva su propio turno y casi todas las peticiones caen en el nodo 1.
        zone api_canchas 64k;

        ${SERVIDORES_API}
    }

    # Los mismos nodos, con su propia rotación, solo para /api/instancia (el
    # pie de página del front). Cada carga de página hace varios pedidos a la API:
    # si la consulta del pie compartiera la rotación, con 2 droplets y un número
    # par de pedidos por página caería siempre en el mismo. Así cada recarga la
    # atiende el droplet siguiente.
    upstream api_instancia {
        zone api_instancia 64k;

        ${SERVIDORES_API}
    }

    server {
        listen 80;
        server_name _;

        # Let's Encrypt comprueba el dominio pidiendo un archivo en esta ruta
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Sin certificado: el sitio se sirve acá. Con certificado: redirige a HTTPS.
        ${SITIO_HTTP}
    }

    # Servidor HTTPS (puerto 443): solo existe si hay certificado para DOMINIO
    ${SERVIDOR_HTTPS}
}
