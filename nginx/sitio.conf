# Rutas del sitio. Las incluye el servidor del puerto 80 o, si hay certificado,
# el del 443 (ver https.envsh).

# Consulta del pie de página: qué droplet atiende
location = /api/instancia {
    proxy_pass http://api_instancia;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 3s;
}

# Peticiones a la API → se reparten entre los droplets
location /api/ {
    proxy_pass http://api_canchas;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Si un nodo está caído o falla, se reintenta en el siguiente
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 3s;
}

# Front (SPA): cualquier ruta desconocida vuelve a index.html
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}
